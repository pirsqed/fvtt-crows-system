name: Release

# Tag a commit as vX.Y.Z (matching the version in system.json) to publish a release
# with the system zip and manifest attached. Keep the manifest's download URL
# aligned with the release tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run system regression tests
        run: node --test tests/*.test.mjs

      - name: Check release packaging
        run: python3 -m unittest discover -s tests -p test_release_package.py

      - name: Check that the tag matches system.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import json; print(json.load(open('system.json'))['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match system.json version $VERSION" >&2
            exit 1
          fi

      - name: Build the system zip
        run: python3 tools/build_release.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fvtt-crows-system.zip
            system.json
          generate_release_notes: true
          prerelease: ${{ github.ref_name == 'v0.2.1' }}
