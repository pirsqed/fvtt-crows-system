name: Release

# Both entry points package an existing version tag and create a reviewable draft.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (vX.Y.Z)
        required: true
        type: string
      prerelease:
        description: Mark the draft as a prerelease
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify existing tag
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Fixture-free regression tests
        run: node --test tests/*.test.mjs
      - name: Release tooling tests
        run: |
          python -m unittest discover -s tests -p test_release_package.py
          python -m unittest discover -s tests -p test_prepare_release.py
      - name: Build release assets
        run: |
          mkdir -p dist
          python tools/build_release.py --output dist/fvtt-crows-system.zip
          cp system.json dist/system.json
      - name: Validate assets and prepare notes and checksums
        run: python tools/prepare_release.py --output dist --manifest system.json --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease || false }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/fvtt-crows-system.zip dist/system.json dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md "${flags[@]}"
