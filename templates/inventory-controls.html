<div class="inventory-card-controls" data-item-id="{{item._id}}">
  {{#if (gt item.system.maxStack 1)}}
  <div class="qty-control flexrow" title="Drag matching items onto this stack to combine them">
    <button type="button" class="item-qty-minus" aria-label="Decrease quantity"><i class="fas fa-minus"></i></button>
    <span class="qty-label">{{item.system.quantity}} / {{item.system.maxStack}}</span>
    <button type="button" class="item-qty-plus" aria-label="Increase quantity"><i class="fas fa-plus"></i></button>
  </div>
  {{/if}}
  {{#if item.system.consumable.maxUD}}
  <div class="ud-controls {{#if (eq item.system.consumable.currentUD 0)}}depleted{{/if}}">
    <button type="button" class="btn-ud item-ud-roll" data-item-id="{{item._id}}" title="Roll usage dice">
      {{#if (eq item.system.consumable.currentUD 0)}}Depleted{{else}}UD {{item.system.consumable.currentUD}} / {{item.system.consumable.maxUD}}{{/if}}
    </button>
    <button type="button" class="item-ud-restore" data-item-id="{{item._id}}" title="Restore usage dice after resting or refilling" aria-label="Restore usage dice"><i class="fas fa-rotate-right"></i></button>
  </div>
  {{/if}}
</div>
